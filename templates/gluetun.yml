id: gluetun
name: Gluetun
description: VPN tunnel — routes the torrent client's traffic through your provider
category: vpn
defaultEnabled: false
container: gluetun
# No port: the control server answers JSON, there is no UI to open.

notes:
  - Restarting Gluetun leaves qBittorrent without a network, since it no longer
    has one of its own. Restart it too.
  - The key and the address come from the same WireGuard config file and must
    match. Copy the whole Address line, commas and all.

# Lends its network namespace to whichever service asks for `vpn`. Nothing here
# names qBittorrent, and qBittorrent does not name Gluetun — see lib/network.ts.
network:
  provides: vpn

compose:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ={{env.TZ}}
      - VPN_SERVICE_PROVIDER={{credentials.provider}}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY={{credentials.private_key}}
      - WIREGUARD_ADDRESSES={{credentials.addresses}}
      - SERVER_COUNTRIES={{credentials.countries}}
    volumes:
      - "{{paths.config}}/gluetun:/gluetun"
    ports:
      # Control server only. The tunnelled services' ports are moved here by the
      # engine when they join, so this list is not the whole story at runtime.
      - "8001:8000"
    # `depends_on: service_healthy` is what keeps a joined service from starting
    # before the tunnel is up and leaking in the clear, so this is required.
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

dirs:
  - gluetun

credentials:
  # Only providers Gluetun supports over WireGuard: this template fixes
  # VPN_TYPE, so an OpenVPN-only provider would ask for a key it cannot use.
  - key: provider
    type: select
    label: VPN Provider
    default: mullvad
    options:
      - { value: mullvad, label: Mullvad }
      - { value: protonvpn, label: Proton VPN }
      - { value: nordvpn, label: NordVPN }
      - { value: surfshark, label: Surfshark }
      - { value: windscribe, label: Windscribe }
      - { value: ivpn, label: IVPN }
      - { value: airvpn, label: AirVPN }
      - { value: cyberghost, label: CyberGhost }
      - { value: privado, label: Privado }
      - { value: torguard, label: TorGuard }
      - { value: custom, label: Custom (wg config) }
  - key: private_key
    type: password
    label: WireGuard Private Key
    # Masked like a password, but not ours to invent: it must match the public
    # key the provider holds. A generated one would look filled in and never
    # bring the tunnel up.
    generate: false
  - key: addresses
    type: text
    label: WireGuard Address
    placeholder: 10.64.0.1/32
  - key: countries
    type: text
    label: Server Countries
    required: false

# The question a VPN exists to answer, and the one thing "running" cannot tell
# you. Left as a dash when the tunnel is down, which is itself the answer.
info:
  - name: exit_ip
    label: IP Address
    url: http://localhost:8001/v1/publicip/ip
    extract: public_ip
    refresh: 300
  - name: exit_country
    label: Country
    url: http://localhost:8001/v1/publicip/ip
    extract: country
    refresh: 300

setup:
  # Since v3.40 the control server denies everything unless a role says
  # otherwise. Two read-only routes are opened, and nothing else: the dashboard
  # needs to read the exit IP, not to steer the tunnel.
  - name: auth
    label: Allow the dashboard to read status
    type: config_file
    file: gluetun/auth/config.toml
    content: |
      [[roles]]
      name = "dashboard"
      routes = ["GET /v1/publicip/ip", "GET /v1/openvpn/status"]
      auth = "none"

  # An exit IP proves far more than a status field: the control server answers,
  # the tunnel is established, and the credentials were accepted. Without the
  # match, a 401 would count as ready — which is exactly what happened before.
  - name: wait_ready
    label: Wait for the tunnel
    type: wait_ready
    url: http://localhost:8001/v1/publicip/ip
    match: '"public_ip"' 
