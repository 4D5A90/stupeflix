id: qbittorrent
name: qBittorrent
description: Pre-configured Movies/TvShows categories
category: torrentClient
defaultEnabled: true
container: qbittorrent
port: 8080

# Asks to be tunnelled. Without a provider installed this does nothing and the
# block below is generated verbatim, so there is no second variant to maintain.
network:
  join: vpn

compose:
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID={{env.PUID}}
      - PGID={{env.PGID}}
      - TZ={{env.TZ}}
      - WEBUI_PORT=8080
    volumes:
      - "{{paths.config}}/qbittorrent:/config"
      - "{{paths.torrents}}:/downloads"
      - "{{paths.media}}:/media"
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

credentials:
  - key: user
    type: text
    label: Username
    default: admin
  - key: pass
    type: password
    label: Password
    rules:
      minLength: 6
      message: Must be at least 6 characters

setup:
  - name: config
    label: Write config file
    type: config_file
    file: qbittorrent/qBittorrent/qBittorrent.conf
    content: |
      [Preferences]
      WebUI\Username={{credentials.user}}
      WebUI\Port=8080

      [BitTorrent]
      Session\DefaultSavePath=/downloads

  - name: wait_ready
    label: Wait for qBittorrent API
    type: wait_ready
    url: http://localhost:8080/api/v2/app/version

  - name: extract_temp_pass
    label: Extract temporary password
    type: extract_from_logs
    container: qbittorrent
    regex: "A temporary password is provided for this session: (\\S+)"
    storeAs: temp_pass

  - name: login
    label: Login with temporary password
    type: api_call
    url: http://localhost:8080/api/v2/auth/login
    method: POST
    contentType: form
    storeCookie: true
    body:
      username: admin
      password: "{{internal.temp_pass}}"

  - name: set_credentials
    label: Set credentials
    type: api_call
    url: http://localhost:8080/api/v2/app/setPreferences
    method: POST
    contentType: form
    useCookie: true
    body:
      json: '{"web_ui_username":"{{credentials.user}}","web_ui_password":"{{credentials.pass}}"}'

  - name: login_new_creds
    label: Login with new credentials
    type: api_call
    url: http://localhost:8080/api/v2/auth/login
    method: POST
    contentType: form
    storeCookie: true
    body:
      username: "{{credentials.user}}"
      password: "{{credentials.pass}}"

  - name: set_auto_tmm
    label: Enable automatic torrent management
    type: api_call
    url: http://localhost:8080/api/v2/app/setPreferences
    method: POST
    contentType: form
    useCookie: true
    body:
      json: '{"auto_tmm_enabled":true,"torrent_changed_tmm_enabled":true,"save_path_changed_tmm_enabled":true,"category_changed_tmm_enabled":true}'

  - name: add_category
    label: Add category
    type: api_call
    foreach: libraries
    url: http://localhost:8080/api/v2/torrents/createCategory
    method: POST
    contentType: form
    useCookie: true
    ignoreStatus: [409]
    body:
      category: "{{library.name}}"
      savePath: "/media/{{library.name}}"
