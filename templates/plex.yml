id: plex
name: Plex
description: Popular, account required
category: mediaServer
defaultEnabled: false
container: plex
port: 32400

notes:
  - The claim token from plex.tv/claim is only valid for a few minutes, and only
    for a first setup. Leave it blank to link the server by hand instead.
  - Without a claim token, finish the setup at localhost:32400/web.

compose:
  plex:
    image: linuxserver/plex:latest
    container_name: plex
    # The name it announces to apps; Docker's default is the container id
    hostname: stupeflix
    environment:
      - PUID={{env.PUID}}
      - PGID={{env.PGID}}
      - TZ={{env.TZ}}
      - VERSION=docker
      # Dropped from the compose file when the user leaves the claim token blank
      - PLEX_CLAIM={{credentials.claim}}
    volumes:
      - "{{paths.config}}/plex:/config"
      - "{{paths.media}}:/media"
    ports:
      - "32400:32400"
    restart: unless-stopped

credentials:
  - key: claim
    type: text
    label: Claim Token (plex.tv/claim) — first setup only
    required: false
  # Behind Docker's bridge Plex only calls its own 172.x subnet local, so a TV on
  # the home network reads as remote and is asked for a Remote Watch Pass. Both
  # are spliced into a query string, hence the patterns: a stray `&` would set
  # whatever pref follows it.
  - key: lan_networks
    type: text
    label: LAN Networks — so devices at home count as local
    placeholder: 192.168.1.0/24
    required: false
    rules:
      pattern: "^[0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]{1,2}(,[0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]{1,2})*$"
      message: One or more subnets, comma-separated, like 192.168.1.0/24
  # Plex advertises the container's own address to plex.tv, which nothing on the
  # LAN can reach; this is the one it should hand out instead.
  - key: lan_url
    type: text
    label: Server URL on your LAN
    placeholder: http://192.168.1.10:32400
    required: false
    rules:
      pattern: "^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?$"
      message: A URL like http://192.168.1.10:32400

setup:
  # /identity answers about a second after boot, but the server only learns which
  # account owns it once it has registered with plex.tv. In that window every
  # privileged call comes back 403 ("Signed-in Token ()" in the Plex log), so
  # waiting on the claim is what makes add_library deterministic.
  - name: wait_ready
    label: Wait for Plex to be claimed
    type: wait_ready
    url: http://localhost:32400/identity
    match: 'claimed="1"'

  - name: extract_token
    label: Extract server token
    type: store
    store:
      from: file
      file: plex/Library/Application Support/Plex Media Server/Preferences.xml
      regex: 'PlexOnlineToken="([^"]+)"'
      as: token
    # Not a retry on failure: Plex writes Preferences.xml when it feels like it,
    # so this is a 60 s wait for the file to carry the token at all.
    maxRetries: 20

  - name: add_library
    label: Add library
    type: api_call
    foreach:
      source: libraries
      map:
        movies:
          content_type: movie
          agent: tv.plex.agents.movie
          scanner: Plex%20Movie
        tvshows:
          content_type: show
          agent: tv.plex.agents.series
          scanner: Plex%20TV%20Series
        music:
          content_type: artist
          agent: tv.plex.agents.music
          scanner: Plex%20Music
    url: http://localhost:32400/library/sections?name={{library.name}}&type={{library.content_type}}&agent={{library.agent}}&scanner={{library.scanner}}&language=en-US&location=/media/{{library.name}}
    method: POST
    # claimed="1" narrows the startup window above but does not close it: the
    # flag flips once the claim is registered, and the server goes on starting
    # after that. On a slow host (a homelab VM) the first POST lands in it, and
    # Plex refuses it either way — 403 while the owner token is unchecked, 400
    # "the server is still starting up" after. A refused POST created nothing,
    # so retrying cannot duplicate a section — 20 × 3 s. The price: a request
    # that is really malformed (400) reports a minute late.
    retryOn: [400, 403, 503]
    maxRetries: 20
    # Plex has no "create if absent": posting a name that already exists answers
    # 201 and makes a second section, so a re-run would duplicate every library.
    # The probe is what keeps this step idempotent — there is no status to ignore.
    # The probe carries this step's Accept header, so it is matched against JSON
    skipIf:
      url: http://localhost:32400/library/sections
      match: '"title":\s*"{{library.name}}"'
    headers:
      X-Plex-Token: "{{internal.token}}"
      X-Plex-Client-Identifier: stupeflix
      X-Plex-Product: Stupeflix
      Accept: application/json

  # Unconditional on purpose: a blank field writes a blank pref, which is Plex's
  # own default, so clearing the field on a reconfigure undoes it too.
  # The UI calls it "LAN Networks"; the pref is LanNetworksBandwidth, and Plex
  # answers 400 to a name it does not know.
  - name: lan_access
    label: Set LAN access
    type: api_call
    url: http://localhost:32400/:/prefs?LanNetworksBandwidth={{credentials.lan_networks}}&customConnections={{credentials.lan_url}}
    method: PUT
    headers:
      X-Plex-Token: "{{internal.token}}"
      X-Plex-Client-Identifier: stupeflix

  - name: scan_libraries
    label: Scan libraries
    type: api_call
    url: http://localhost:32400/library/sections/all/refresh
    method: GET
    headers:
      X-Plex-Token: "{{internal.token}}"
      X-Plex-Client-Identifier: stupeflix

actions:
  scan:
    name: scan
    label: Scan
    icon: refresh
    type: api_call
    url: http://localhost:32400/library/sections/all/refresh
    method: GET
    maxRetries: 0
    headers:
      X-Plex-Token: "{{internal.token}}"
      X-Plex-Client-Identifier: stupeflix
